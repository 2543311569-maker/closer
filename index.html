<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解决选择困难症-点菜</title>
    <style>
        :root {
            --primary: #2d5a27;
            --accent: #d97706;
            --bg: #fffbf5;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg);
            padding: 20px;
            padding-bottom: 60px;
            color: #333;
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

            nav a {
                text-decoration: none;
                color: var(--primary);
                font-weight: bold;
                padding: 10px 20px;
                border-radius: 8px;
                background: #eee;
                transition: 0.3s;
            }

                nav a:hover, nav a.active {
                    background: var(--primary);
                    color: white;
                }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }

            .full-width {
                grid-column: 1 / -1;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        h1, h2 {
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-size: 14px;
                font-weight: bold;
                color: #555;
            }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            outline: none;
            background: #fafafa;
            transition: 0.3s;
        }

            input:focus, select:focus, textarea:focus {
                border-color: var(--primary);
                background: #fff;
            }

        textarea {
            resize: none;
            height: 60px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

            .btn:hover {
                background: var(--accent);
            }

        .btn-cancel {
            background: #94a3b8;
            display: none;
            margin-top: 10px;
        }

            .btn-cancel:hover {
                background: #64748b;
            }

        .recipe-list {
            list-style: none;
            margin-top: 15px;
        }

            .recipe-list li {
                padding: 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #fff;
            }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .tag-hot {
            background: #fee2e2;
            color: #ef4444;
        }

        .tag-cold {
            background: #e0f2fe;
            color: #0ea5e9;
        }

        .tag-soup {
            background: #fef3c7;
            color: #d97706;
        }

        /* 新增：扁平化操作按钮组 */
        .action-group {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }

        .btn-icon {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-edit {
            background: #e0f2fe;
            color: #0ea5e9;
        }

            .btn-edit:hover {
                background: #bae6fd;
            }

        .btn-delete {
            background: #fee2e2;
            color: #ef4444;
        }

            .btn-delete:hover {
                background: #fecaca;
            }

        .cursor-dot {
            width: 20px;
            height: 20px;
            background-color: var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="customCursor"></div>
    <nav>
        <a href="index.html" class="active">1. 点菜</a>
        <a href="list.html">2. 买菜</a>
        <a href="cook.html">3. 做菜</a>
    </nav>
    <h1>📖 阶段一：点菜</h1>
    <div class="container">
        <div class="panel" id="formPanel">
            <h2 id="formTitle">➕ 录入独家做法</h2>
            <div class="form-group"><label>菜名</label><input type="text" id="inputName" placeholder="如: 葱爆肉"></div>
            <div class="form-group">
                <label>类型 (决定做菜顺序)</label>
                <select id="selectCategory">
                    <option value="soup">🍲 慢炖 </option>
                    <option value="cold">❄️ 凉菜 </option>
                    <option value="hot">🔥 爆炒 </option>
                </select>
            </div>
            <div class="form-group"><label>主料 (空格隔开)</label><input type="text" id="inputMain" placeholder="如: 猪肉"></div>
            <div class="form-group"><label>辅料 (空格隔开)</label><input type="text" id="inputSub" placeholder="如: 大葱"></div>
            <div class="form-group"><label>调料 (空格隔开)</label><input type="text" id="inputSpice" placeholder="如: 生姜 大蒜"></div>
            <div class="form-group"><label>步骤</label><textarea id="inputMethod" placeholder="如: 大火爆炒。"></textarea></div>
            <button class="btn" id="btnAdd">存入系统库</button>
            <button class="btn btn-cancel" id="btnCancel">取消修改</button>
        </div>

        <div class="panel">
            <h2>🎲 点菜盲盒</h2>
            <button class="btn" style="background: var(--accent);" id="btnLucky">抽取今日菜单</button>
            <div id="luckyResult" style="text-align: center; margin-top: 15px; color: var(--primary); font-weight: bold;"></div>
        </div>

        <div class="panel full-width">
            <h2>✅ 今日菜单 </h2>
            <ul class="recipe-list" id="uiRecipeList"></ul>
        </div>
    </div>

    <script>
        window.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('customCursor');
            if (cursor) { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; }
        });

        const defaultRecipes = [
            { name: "土豆炖牛腩", category: "hot", main: ["牛腩"], sub: ["土豆"], spice: ["老姜", "冰糖", "香葱", "生抽", "盐"], method: "1.将牛腩肉洗净并沥干水分，切成2-3厘米见方的方块,土豆削皮，切成小块，浸泡在水中防止氧化。2.牛腩肉放入煮锅中，加入足够的冷水，移至大火上，烧开后继续汆烫5-8分钟，倒掉汤汁，捞出牛腩肉块，用热的流动水冲去杂质。3.大火加热炒锅中的油，放入香葱结（或大葱1根，切成大段）、老姜片和炒出香气。4.把锅中的香葱结和姜片挑出，加入牛腩块煸炒至表面收紧，加入切好的土豆块。调入生抽，倒入可以没过锅中食材的热水，调入盐和冰糖，改大火煮沸后转小火煮2小时。5.出锅前改大火煮沸2分钟，至肉烂汁浓即可，出锅时点缀香葱" },
            { name: "拍黄瓜", category: "cold", main: ["黄瓜"], sub: ["小米辣"], spice: ["蒜末", "生抽", "盐", "香醋", "辣椒油", "小葱"], method: "1.黄瓜洗净拍碎，斜刀切块。2.蒜切末，葱、小米辣切小段。3.拍好的黄瓜先加入小半勺的盐拌均腌着备用。4.取一小碗依次加入辣椒油、生抽、香醋、和切好的辣椒葱蒜拌均。5.将调好的汁料倒入黄瓜里拌均匀" },
            { name: "胡萝卜排骨汤", category: "soup", main: ["排骨"], sub: ["胡萝卜"], spice: ["姜" ,"盐"],method: "1.洗净排骨后加入姜片焯水。 2.大胡萝卜切块和排骨放入锅中加水、盐火慢炖1小时。" },
            { name: "椒麻鸡", category: "cold", main: ["蛋鸡"], sub: ["香菜"], spice: ["辣椒20g", "花椒200g","黄栀子两粒","草果两粒","白蔻5g","白芷4g","干姜50g", "八角5g","香叶3g","小茴香5g"], method: "1.蛋鸡泡水去血后冷水焯水。2.将香料泡水洗净入锅盖盖煮一小时。3.炒料：一炒勺油，辣椒切碎放入，小火慢炒，炒出辣椒油辣椒加汤汁（约一电饭锅）放入电饭煲熬煮花椒与油比例1: 3，开始熬花椒油，全程小火慢熬，加少许葱叶，大约需要熬4小时辣椒汤汁熬煮一小时后，加入葱姜蒜鸡精各一把，花椒味精各一汤勺，再熬煮15分钟5.拌鸡鸡肉撕好加配菜，放入3勺盐。" }
        ];

        let myRecipes = JSON.parse(localStorage.getItem('myRecipes')) || defaultRecipes;
                let selectedNames = JSON.parse(localStorage.getItem('selectedNames')) || ["土豆炖牛腩", "胡萝卜排骨汤"];

        // 核心状态锁：用于判断当前是“新增”还是“修改”
        let editingIndex = -1;

        document.addEventListener('DOMContentLoaded', () => {
            renderList();
            document.getElementById('btnAdd').addEventListener('click', saveRecipe);
            document.getElementById('btnCancel').addEventListener('click', resetForm);
            document.getElementById('btnLucky').addEventListener('click', runLuckyPick);
        });

        function renderList() {
            localStorage.setItem('myRecipes', JSON.stringify(myRecipes));
            localStorage.setItem('selectedNames', JSON.stringify(selectedNames));

            const listObj = document.getElementById('uiRecipeList');
            listObj.innerHTML = "";
            myRecipes.forEach((item, index) => {
                let isChecked = selectedNames.includes(item.name) ? 'checked' : '';
                let catTag = item.category === "hot" ? "🔥热菜" : (item.category === "cold" ? "❄️凉菜" : "🍲汤羹");

                // 新增了编辑和删除模块
                listObj.innerHTML += `
                        <li>
                            <label style="display:flex;align-items:center;gap: 8px;text-align:left;cursor:none; font-weight:bold; flex:1;">
                                <input type="checkbox" ${isChecked} onchange="toggleSelect('${item.name}', this)"> ${item.name}
                            </label>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span style="font-size:12px; color:#666;">${catTag}</span>
                                <div class="action-group">
                                    <button class="btn-icon btn-edit" onclick="editRecipe(${index})">修改</button>
                                    <button class="btn-icon btn-delete" onclick="deleteRecipe(${index})">删除</button>
                                </div>
                            </div>
                        </li>`;
            });
        }

        function toggleSelect(name, box) {
            if (box.checked) { if (!selectedNames.includes(name)) selectedNames.push(name); }
            else { selectedNames = selectedNames.filter(n => n !== name); }
            localStorage.setItem('selectedNames', JSON.stringify(selectedNames));
        }

        // ====== 核心功能 1：激活修改模式 ======
        function editRecipe(index) {
            editingIndex = index;
            const target = myRecipes[index];

            // 逆向提取数据填入表单
            document.getElementById('inputName').value = target.name;
            document.getElementById('selectCategory').value = target.category;
            document.getElementById('inputMain').value = target.main.join(' ');
            document.getElementById('inputSub').value = target.sub.join(' ');
            document.getElementById('inputSpice').value = target.spice.join(' ');
            document.getElementById('inputMethod').value = target.method;

            // UI 视觉接管：改变面板属性与按钮颜色
            document.getElementById('formTitle').innerText = "✏️ 修改独家做法";
            const btnAdd = document.getElementById('btnAdd');
            btnAdd.innerText = "💾 保存修改";
            btnAdd.style.background = "var(--accent)";
            document.getElementById('btnCancel').style.display = "block";

            // 平滑滚动定位回顶部录入区，保证效率体感
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ====== 核心功能 2：保存与覆盖数据 ======
        function saveRecipe() {
            const name = document.getElementById('inputName').value.trim();
            if (name === "") { alert("菜名不能为空！"); return; }

            // 组装最新输入的数据体
            const currentData = {
                name: name,
                category: document.getElementById('selectCategory').value,
                main: document.getElementById('inputMain').value.split(' ').filter(i => i),
                sub: document.getElementById('inputSub').value.split(' ').filter(i => i),
                spice: document.getElementById('inputSpice').value.split(' ').filter(i => i),
                method: document.getElementById('inputMethod').value
            };

            if (editingIndex > -1) {
                // 如果处于修改模式：处理旧名字与新名字的关系
                const oldName = myRecipes[editingIndex].name;
                myRecipes[editingIndex] = currentData; // 覆盖底层数组

                // 如果在修改时改了菜名，且这道菜正好被勾选了，需要同步更新勾选池
                if (oldName !== name && selectedNames.includes(oldName)) {
                    selectedNames = selectedNames.filter(n => n !== oldName);
                    selectedNames.push(name);
                }
            } else {
                // 如果是正常的录入模式：推入新数据
                myRecipes.push(currentData);
            }

            resetForm(); // 重置表单 UI
            renderList(); // 重新渲染全局 DOM
        }

        // ====== 核心功能 3：删除数据 ======
        function deleteRecipe(index) {
            const confirmDel = confirm(`确定要把【${myRecipes[index].name}】从系统库中彻底抹除吗？`);
            if (confirmDel) {
                const targetName = myRecipes[index].name;
                myRecipes.splice(index, 1); // 从数组核心剔除
                selectedNames = selectedNames.filter(n => n !== targetName); // 从勾选队列剔除
                renderList();
            }
        }

        // ====== 表单 UI 状态重置 ======
        function resetForm() {
            editingIndex = -1;
            document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
            document.getElementById('selectCategory').selectedIndex = 0;
            document.getElementById('formTitle').innerText = "➕ 录入独家做法";

            const btnAdd = document.getElementById('btnAdd');
            btnAdd.innerText = "存入系统库";
            btnAdd.style.background = "var(--primary)";
            document.getElementById('btnCancel').style.display = "none";
        }

        let lastPick = "";
        function runLuckyPick() {
            if (myRecipes.length === 0) return;
            let pickName = ""; let safeCounter = 0;
            do {
                let randomIndex = Math.floor(Math.random() * myRecipes.length);
                pickName = myRecipes[randomIndex].name;
                safeCounter++;
                if (safeCounter > 10) break;
            } while (pickName === lastPick && myRecipes.length > 1);

            lastPick = pickName;
            if (!selectedNames.includes(pickName)) { selectedNames.push(pickName); renderList(); }
            document.getElementById('luckyResult').innerHTML = `🎯 盲盒选中：${pickName}`;
        }
    </script>
</body>
</html>
